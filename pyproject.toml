[project]
name = "ring-studio"
version = "0.1.0"
description = "A modular, realtime workspace for AI Ring"
requires-python = ">=3.12"
dependencies = [
    "PyQt6>=6.10,<7",
 "numpy>=2,<3",
 "bleak>=1.1,<3",
 "h5py>=3.12,<4",
 "PyYAML>=6,<7",
 "smpclient[ble]>=7,<8",
]

[project.scripts]
ring-studio = "ring.main:main"
ringo-vpet = "ring.apps.vpet.__main__:main"

[project.optional-dependencies]
density = ["ai-edge-litert>=2.2,<3"]
handwriting = ["torch>=2.6,<3"]
click = [
    "pynput>=1.8,<2",
    "torch>=2.6,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ring"]
